<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — The Copper Fork</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { font-family: var(--font-mono); color: var(--muted); width: 20px; }
  .rank-bar-track { flex: 1; height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
  .rank-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .rank-val { width: 70px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
</style>
</head>
<body>
  <div id="app-shell"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
