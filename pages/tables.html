<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables — The Copper Fork</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .table-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--line); }
  .table-card.available { border-top-color: var(--herb); }
  .table-card.occupied { border-top-color: var(--danger); }
  .table-card.reserved { border-top-color: var(--steel); }
  .table-card .t-number { font-family: var(--font-display); font-size: 24px; }
  .table-card .t-cap { font-size: 12px; color: var(--muted); }
  .table-card .t-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>
  <div id="app-shell"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/tables.js"></script>
</body>
</html>
