<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Menu — The Copper Fork</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../css/dashboard.css"
  >

  <link
    rel="stylesheet"
    href="../css/responsive.css"
  >

  <style>

    /* ================================
       MENU GRID
    ================================= */

    .menu-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(240px, 1fr)
        );

      gap: 16px;

    }


    /* ================================
       MENU CARD
    ================================= */

    .menu-item-card {

      background: var(--surface);

      border: 1px solid var(--line);

      border-radius: var(--radius-lg);

      padding: 18px;

      display: flex;

      flex-direction: column;

      gap: 8px;

    }


    /* ================================
       MENU IMAGE
    ================================= */

    .mi-photo {

      width: 100%;

      height: 180px;

      border-radius: var(--radius-sm);

      overflow: hidden;

      background: var(--paper);

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .mi-photo img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* ================================
       MENU TOP
    ================================= */

    .menu-item-card .mi-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

    }


    /* ================================
       PRICE
    ================================= */

    .menu-item-card .mi-price {

      font-family: var(--font-mono);

      font-weight: 700;

      color: var(--accent-ink);

    }


    /* ================================
       DESCRIPTION
    ================================= */

    .menu-item-card .mi-desc {

      font-size: 12.5px;

      color: var(--muted);

      min-height: 32px;

    }


    /* ================================
       FOOTER
    ================================= */

    .menu-item-card .mi-foot {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 6px;

    }


    /* ================================
       RECIPE
    ================================= */

    .recipe-row {

      display: flex;

      gap: 8px;

      align-items: center;

      margin-bottom: 8px;

    }

    .recipe-row select {

      flex: 1;

    }

    .recipe-row input {

      width: 80px;

    }


    /* ================================
       FALLBACK IMAGE
    ================================= */

    .mi-photo-fallback {

      font-family: var(--font-display);

      font-size: 34px;

      color: var(--muted);

    }


    /* ================================
       PHOTO PICKER
    ================================= */

    .photo-picker {

      display: flex;

      gap: 14px;

      align-items: center;

    }

    .photo-preview {

      width: 84px;

      height: 84px;

      border-radius: var(--radius-sm);

      background: var(--paper);

      border: 1px solid var(--line);

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      flex-shrink: 0;

    }

    .photo-preview img {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }

    .photo-preview span {

      font-size: 11px;

      color: var(--muted);

    }

    .photo-picker-actions {

      display: flex;

      gap: 8px;

    }

  </style>

</head>


<body>


  <!-- Application Shell -->

  <div id="app-shell"></div>


  <!-- Storage / Database -->

  <script src="../js/storage.js"></script>


  <!-- Main Application -->

  <script src="../js/app.js"></script>


  <!-- Menu Page -->

  <script src="../js/menu.js"></script>


</body>

</html>
